[project]
name = "gtm-trusted-layer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.8,<1.9",
    "dbt-duckdb>=1.8,<1.9",
    "duckdb>=0.10",
    "typer>=0.12,<0.13",
    "click==8.1.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gtm = "gtm.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gtm"]
